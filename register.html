<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — Resep Saku</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>

        <div class="auth-header">
            <div class="logo-icon">
                <i class="fas fa-fire"></i>
            </div>
            <h1>Buat akun Resep Saku</h1>
            <p>Daftar untuk menyimpan resep favoritmu</p>
        </div>

        <div class="auth-card">
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" name="username" placeholder="Masukkan username" autocomplete="username" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="Buat password (minimal 8 karakter)" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <input type="password" id="confirm-password" placeholder="Ulangi password" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>

                <button type="submit" class="btn-primary full-width">Daftar</button>
            </form>

            <p class="auth-link">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
